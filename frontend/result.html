<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamAI | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-base: #07080f;
            --surface: rgba(255, 255, 255, 0.04);
            --border-light: rgba(255, 255, 255, 0.08);
            --text-main: #f0f0f0;
            --text-muted: rgba(255, 255, 255, 0.5);
            --accent-primary: #f0c040;
            --accent-secondary: #00e5cc;
            --accent-tertiary: #00b4d8;
            --success: #00e676;
            --warning: #f0c040;
            --danger: #ff5252;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { color: var(--text-main); min-height: 100vh; padding: 20px 10px; background: #07080f; position: relative; overflow-x: hidden; }
        body::before { content: ''; position: fixed; inset: 0; opacity: 0.15; z-index: -1; pointer-events: none; background: radial-gradient(circle at 100% 100%, var(--accent-primary) 0%, transparent 40%), radial-gradient(circle at 0% 0%, var(--accent-secondary) 0%, transparent 40%); }

        .container { max-width: 1050px; margin: 0 auto; animation: slideUpFade 0.8s ease forwards; padding: 20px; }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .logo { font-size: 26px; font-weight: 800; background: linear-gradient(to right, #ffffff, var(--accent-primary)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 2px; }
        .btn-back { padding: 12px 28px; border-radius: 14px; font-weight: 700; background: rgba(255, 255, 255, 0.05); color: #fff; text-decoration: none; border: 1px solid var(--border-light); transition: 0.3s; backdrop-filter: blur(10px); }
        .btn-back:hover { transform: translateX(-5px); background: rgba(240, 192, 64, 0.1); border-color: var(--accent-primary); box-shadow: 0 0 15px rgba(240, 192, 64, 0.3); }

        .score-banner { background: linear-gradient(135deg, rgba(240, 192, 64, 0.1), rgba(0, 229, 204, 0.05)); border: 1px solid rgba(240, 192, 64, 0.2); border-radius: 28px; padding: 45px; text-align: center; margin-bottom: 32px; backdrop-filter: blur(20px); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
        .score-title { color: var(--text-muted); text-transform: uppercase; letter-spacing: 3px; font-size: 14px; font-weight: 600; }
        .score-val { font-size: 85px; font-weight: 800; margin: 10px 0; background: linear-gradient(135deg, #fff, #ffb6ff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 15px rgba(255, 42, 133, 0.5)); line-height: 1; }
        .score-lbl { display: inline-block; font-size: 20px; font-weight: 700; padding: 8px 24px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1.5px; }
        .score-desc { margin-top: 18px; font-size: 14px; color: rgba(255, 255, 255, 0.55); max-width: 520px; margin-left: auto; margin-right: auto; line-height: 1.7; }

        .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .metric-card { background: var(--surface); border: 1px solid var(--border-light); border-radius: 20px; padding: 25px; backdrop-filter: blur(16px); transition: 0.4s; }
        .metric-card:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.08); border-color: rgba(240, 192, 64, 0.3); }
        .m-icon { font-size: 28px; margin-bottom: 12px; }
        .m-title { font-size: 14px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .m-val { font-size: 32px; font-weight: 800; color: #fff; }
        .m-status { display: inline-block; margin-top: 10px; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; }

        .insight-box { background: var(--surface); border: 1px solid var(--border-light); border-radius: 24px; padding: 30px; margin-bottom: 32px; backdrop-filter: blur(16px); }
        .insight-box h3 { font-size: 18px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        .insight-box h3 span { color: var(--accent-primary); margin-right: 8px; }
        .insight-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
        .insight-item { display: flex; align-items: flex-start; gap: 14px; padding: 16px; background: rgba(255, 255, 255, 0.03); border-radius: 14px; }
        .insight-icon { font-size: 22px; }

        .charts { display: grid; grid-template-columns: 1fr 2fr; gap: 24px; }
        @media (max-width: 850px) { .charts { grid-template-columns: 1fr; } }
        .chart-box { background: var(--surface); border: 1px solid var(--border-light); border-radius: 24px; padding: 30px; backdrop-filter: blur(16px); }

        .log-box { background: #050505; border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; font-family: 'Courier New', monospace; font-size: 12px; color: #888; line-height: 1.6; overflow-x: auto; min-height: 100px; }
        .loading-screen { position: fixed; inset: 0; background: #07080f; z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .loader { width: 50px; height: 50px; border: 4px solid var(--accent-primary); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body>
    <div id="loading" class="loading-screen"><div class="loader"></div></div>

    <div class="container" id="mainContent" style="display: none;">
        <header class="header">
            <div class="logo">⚡ StreamAI</div>
            <a href="index.html" class="btn-back">← New Analysis</a>
        </header>

        <div class="score-banner">
            <div class="score-title">A.I. Prediction Output</div>
            <div class="score-val" id="scoreVal">0</div>
            <div class="score-lbl" id="scoreLbl">Analyzing...</div>
            <p class="score-desc" id="scoreDesc"></p>
            <div style="margin-top: 20px; display: flex; justify-content: center; gap: 15px;">
                <button id="downloadBtn" class="btn-back" style="background: rgba(0, 229, 204, 0.1); border-color: rgba(0, 229, 204, 0.3);">📥 Download PDF</button>
            </div>
        </div>

        <div class="metrics">
            <div class="metric-card">
                <div class="m-icon">📶</div><div class="m-title">Signal Strength</div>
                <div class="m-val" id="valSignal">-- <small>dBm</small></div>
                <span class="m-status" id="sigStatus">-</span>
            </div>
            <div class="metric-card">
                <div class="m-icon">⚡</div><div class="m-title">Speed</div>
                <div class="m-val" id="valSpeed">-- <small>Mbps</small></div>
                <span class="m-status" id="speedStatus">-</span>
            </div>
            <div class="metric-card">
                <div class="m-icon">⏱️</div><div class="m-title">Latency</div>
                <div class="m-val" id="valLatency">-- <small>ms</small></div>
                <span class="m-status" id="latStatus">-</span>
            </div>
            <div class="metric-card">
                <div class="m-icon">〰️</div><div class="m-title">Jitter</div>
                <div class="m-val" id="valJitter">-- <small>ms</small></div>
                <span class="m-status" id="jitterStatus">-</span>
            </div>
        </div>

        <div class="insight-box">
            <h3><span>●</span> Metric Hierarchy</h3>
            <div style="height: 300px;"><canvas id="barChart"></canvas></div>
        </div>

        <div class="insight-box">
            <h3><span>●</span> Session Trace Logs</h3>
            <div class="log-box" id="logBox"></div>
        </div>
    </div>

    <script type="module">
        import CONFIG from './config.js';

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        async function init() {
            if (!id) {
                alert('No ID found in URL.');
                window.location.href = 'index.html';
                return;
            }

            try {
                const res = await fetch(`${CONFIG.API_BASE_URL}/api/view/${id}`);
                const data = await res.json();
                
                if (data.error) throw new Error(data.error);

                renderData(data);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';

                document.getElementById('downloadBtn').onclick = () => {
                    window.location.href = `${CONFIG.API_BASE_URL}/download_report/${id}`;
                };

            } catch (err) {
                console.error(err);
                alert('Failed to load data.');
                window.location.href = 'index.html';
            }
        }

        function renderData(data) {
            const score = data.prediction;
            const sig = data.features[0], spd = data.features[1], lat = data.features[2], jit = data.features[3];

            // Score animation
            let cur = 0;
            const interval = setInterval(() => {
                if (cur >= score) { clearInterval(interval); return; }
                cur++; document.getElementById('scoreVal').innerText = cur;
            }, 100);

            // Labels
            const lbl = document.getElementById('scoreLbl');
            const desc = document.getElementById('scoreDesc');
            const info = [
                { val: 5, label: 'Excellent', bg: '#00e676', text: '🎉 Network is optimal for 4K/8K streaming. Perfect conditions.' },
                { val: 4, label: 'Good', bg: '#00b4d8', text: '✅ Solid connection. HD streaming is smooth with minimal jitter.' },
                { val: 3, label: 'Fair', bg: '#f0c040', text: '⚠️ Average conditions. Resolution may occasionally drop.' },
                { val: 2, label: 'Poor', bg: '#ff5252', text: '🟠 Low quality. Expect buffering or SD resolution.' },
                { val: 1, label: 'Critical', bg: '#ff0000', text: '❌ Critically low network quality. Check connection.' }
            ];
            const si = info.find(i => score >= i.val) || info[4];
            lbl.innerText = si.label; lbl.style.background = si.bg; desc.innerText = si.text;

            // Metrics
            const badge = (el, val, colors) => { 
                el.innerText = val; el.style.background = colors.bg; el.style.color = '#000';
            };
            document.getElementById('valSignal').innerHTML = sig.toFixed(1) + ' <small>dBm</small>';
            badge(document.getElementById('sigStatus'), sig >= -75 ? 'Strong' : 'Weak', { bg: sig >= -75 ? '#00e676' : '#ff5252' });
            
            document.getElementById('valSpeed').innerHTML = spd.toFixed(1) + ' <small>Mbps</small>';
            badge(document.getElementById('speedStatus'), spd >= 200 ? 'Fast' : 'Slow', { bg: spd >= 200 ? '#00e676' : '#ff5252' });
            
            document.getElementById('valLatency').innerHTML = lat.toFixed(1) + ' <small>ms</small>';
            badge(document.getElementById('latStatus'), lat <= 30 ? 'Low' : 'High', { bg: lat <= 30 ? '#00e676' : '#ff5252' });
            
            document.getElementById('valJitter').innerHTML = jit.toFixed(1) + ' <small>ms</small>';
            badge(document.getElementById('jitterStatus'), jit <= 10 ? 'Stable' : 'Unstable', { bg: jit <= 10 ? '#00e676' : '#ff5252' });

            // Logs
            document.getElementById('logBox').innerHTML = data.logs.map(l => `<div>> ${l}</div>`).join('');

            // Chart
            new Chart(document.getElementById('barChart'), {
                type: 'bar',
                data: {
                    labels: data.feature_names,
                    datasets: [{ data: data.importances, backgroundColor: '#f0c040', borderRadius: 8 }]
                },
                options: {
                    maintainAspectRatio: false,
                    scales: { y: { display: false }, x: { grid: { display: false }, ticks: { color: '#888' } } },
                    plugins: { legend: { display: false } }
                }
            });
        }

        init();
    </script>
</body>
</html>
